{% extends 'books/base.html' %}

{% block content %}

<h2>Book Records</h2>

<a href="{% url 'book_create' %}">Add New Book</a>

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>₹{{ book.price }}</td>
        <td>
            <a href="{% url 'book_update' book.id %}">
                Edit
            </a>

            <a class="delete"
               href="{% url 'book_delete' book.id %}">
                Delete
            </a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No books available.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
